[project]
name = "seo-platform-backend"
version = "0.1.0"
description = "SEO + AEO + GEO audit and optimization platform (API + workers)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "httpcore>=1.0",
  "lxml>=5.2",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "cryptography>=42",
  "stripe>=10",
  "anthropic>=0.40",
  "nh3>=0.2.17",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "E501", "UP042", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
