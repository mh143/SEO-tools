# Edge reverse proxy (single public entry point).
# /api/* goes straight to FastAPI; everything else to Next.js.
# X-Forwarded-For is OVERWRITTEN with the real peer address so clients cannot spoof their IP
# (rate limits and audit logs depend on it). Terminate TLS here or at your load balancer.
server {
    listen 80;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
